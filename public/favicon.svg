<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Marine Navy to Dental Teal -->
    <linearGradient id="hdh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07192b"/>
      <stop offset="60%" stop-color="#091e34"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Tooth Porcelain Gradient -->
    <linearGradient id="hdh-tooth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>

    <!-- Sparkle Gold-Cyan Gradient -->
    <linearGradient id="hdh-sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    
    <!-- Soft Depth Shadow -->
    <filter id="hdh-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#042f2e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#hdh-bg)" stroke="#14b8a6" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Dental Tooth Icon with Shadow -->
  <g filter="url(#hdh-shadow)">
    <!-- Stylized Anatomical Tooth Crown & Double Roots -->
    <path d="M 32 15
             C 27.5 15, 20 16.5, 18 21.5
             C 16 26.5, 17 31, 18.5 35.5
             C 20 40, 22 47.5, 25 48.5
             C 27.5 49.5, 29 44, 30.5 40
             C 31.2 38, 32.8 38, 33.5 40
             C 35 44, 36.5 49.5, 39 48.5
             C 42 47.5, 44 40, 45.5 35.5
             C 47 31, 48 26.5, 46 21.5
             C 44 16.5, 36.5 15, 32 15 Z"
          fill="url(#hdh-tooth)"/>

    <!-- Medical Plus / Cross Accent inside Tooth -->
    <rect x="30" y="23" width="4" height="11" rx="1.5" fill="#0d9488" fill-opacity="0.85"/>
    <rect x="26.5" y="26.5" width="11" height="4" rx="1.5" fill="#0d9488" fill-opacity="0.85"/>
  </g>

  <!-- Brilliant Sparkle at Upper Right -->
  <path d="M 48 9
           Q 48 14 53 14
           Q 48 14 48 19
           Q 48 14 43 14
           Q 48 14 48 9 Z"
        fill="url(#hdh-sparkle)"/>

  <!-- Center highlight on sparkle -->
  <circle cx="48" cy="14" r="1.2" fill="#ffffff"/>
  
  <!-- Subtle enamel gleam dot on left cusp -->
  <circle cx="23" cy="20" r="1.2" fill="#38bdf8" fill-opacity="0.75"/>
</svg>